<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goverment layout</title>
    <style>
        body {
            margin: 0;
        }

        h1 {
            text-align: center;
        }

        .border {
            height: 200px;
            border: none;
            background-color: #1f2937;
            text-align: center;
            font-size: 40px;
            color: white;
            justify-content: center;
            align-items: center;
        }
        .header{
             height: 200px;
            border: none;
            background-color: #111827;

            
            
        }

        h2 {
            margin: 0;
            text-align: center;
            font-size: 40px;
            color: #ffffff;
        }

        .footer {
            height: 200px;
            border: none;
            background-color: #111827;
            font-size: 40px;
            color: #ffffff;
            text-align: center;

        }

        .main {
            height: 600px;
            display: flex;
            background-color: #ffffff;

        }
        .left{
            height: 100%;
            width: 20%;
            background-color: #374151;
             font-size: 40px;
            color: #ffffff;
            text-align: center;
        }
        .right{
            height: 100%;
            width: 80%;
            background-color: rgb(209, 206, 206);
             font-size: 40px;
            color: #ffffff;
        }
        .top{
            height: 50%;
            background-color: #172c5a;
             font-size: 40px;
            color: #ffffff;
            text-align: center;

        }
        .bottom{
            height: 50%;
            background-color: rgb(34, 34, 82);
            display: flex;
        }
        .b1{
            background-color: #162030;
            height: 100%;
            width: 50%;
             font-size: 40px;
            color: #ffffff;

        }
        .b2{
            background-color: #1f2937;
            height: 100%;
            width: 50%;
             font-size: 40px;
            color: #ffffff;
        }

    </style>
</head>

<body>
<h1>Flexbox</h1>
<div class="header">
    <h2>Header</h2>

</div>
<div class="main">
    <div class="left">Left</div>
    <div class="right">
        <div class="top"> Right-Top</div>
        <div class="bottom">
            <div class="b1">Bottom 1</div>
            <div class="b2">Bottom 2</div>
        </div>
    </div>
   
</div>
<div class="footer">Footer</div>
</body>

</html>
